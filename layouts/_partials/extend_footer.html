{{- /* 目录抽屉：把 PaperMod 原有的 details.toc 改造成右侧滑出面板。
       只在这一页有 .post-single details.toc 时才生效，列表页、首页不受影响。 */ -}}
<script>
(function () {
    var toc = document.querySelector('.post-single details.toc');
    if (!toc) return;

    /* 面板靠 transform 藏到屏幕外，所以内容要一直展开着 */
    toc.setAttribute('open', '');

    var head = document.createElement('div');
    head.className = 'toc-drawer-head';
    var label = document.createElement('span');
    label.textContent = '目录';
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'toc-close';
    closeBtn.setAttribute('aria-label', '关闭目录');
    closeBtn.textContent = '\u00d7';
    head.appendChild(label);
    head.appendChild(closeBtn);
    toc.insertBefore(head, toc.firstChild);

    var backdrop = document.createElement('div');
    backdrop.className = 'toc-backdrop';

    var fab = document.createElement('button');
    fab.type = 'button';
    fab.className = 'toc-fab';
    fab.setAttribute('aria-expanded', 'false');
    fab.setAttribute('aria-label', '打开目录');
    fab.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>目录</span>';

    document.body.appendChild(backdrop);
    document.body.appendChild(fab);

    function setOpen(open) {
        document.body.classList.toggle('toc-open', open);
        fab.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    fab.addEventListener('click', function () {
        setOpen(!document.body.classList.contains('toc-open'));
    });
    closeBtn.addEventListener('click', function () { setOpen(false); });
    backdrop.addEventListener('click', function () { setOpen(false); });

    /* 点了章节就收起，露出正文 */
    toc.addEventListener('click', function (e) {
        if (e.target.closest('a')) setOpen(false);
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && document.body.classList.contains('toc-open')) {
            setOpen(false);
            fab.focus();
        }
    });
})();
</script>
