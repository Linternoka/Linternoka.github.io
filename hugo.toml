baseURL = 'https://linternoka.github.io/'
title = 'liNterNoka_11'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh'
theme = 'PaperMod'
enableRobotsTXT = true
hasCJKLanguage = true
capitalizeListTitles = false
summaryLength = 60

[pagination]
  pagerSize = 30

[taxonomies]
  category = 'categories'
  tag = 'tags'
  platform = 'platforms'
  kind = 'kinds'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup.goldmark.renderer]
  unsafe = true
  hardWraps = true

[params]
  env = 'production'
  description = '记录、展示、分享'
  defaultTheme = 'auto'
  ShowReadingTime = false
  ShowShareButtons = false
  ShowToc = true
  TocOpen = false
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = false
  ShowRssButtonInSectionTermList = false
  mainSections = ['archive']
  DateFormat = '2006-01-02'

  # 首页顶部头像/昵称/副标题走这里（layouts/home.html 读取），profileMode 本身保持关闭
  [params.profileMode]
    enabled = false
    title = 'liNterNoka_11'
    subtitle = '记录、展示、分享'
    imageUrl = 'images/avatar.jpg'
    imageTitle = 'liNterNoka_11'
    imageWidth = 140
    imageHeight = 140

    [[params.profileMode.buttons]]
      name = '归档'
      url = '/archives/'

    [[params.profileMode.buttons]]
      name = '推荐'
      url = '/works/'

    [[params.profileMode.buttons]]
      name = 'GitHub'
      url = 'https://github.com/Linternoka'

  [params.homeInfoParams]
    Title = 'liNterNoka_11'
    AlignSocialIconsTo = 'center'
    # 关于文字写在这里，支持 Markdown，多段用 ''' ... ''' 包起来
    Content = ''

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/Linternoka'

  [[params.socialIcons]]
    name = 'rss'
    url = 'https://linternoka.github.io/index.xml'

  [[params.socialIcons]]
    name = 'email'
    url = 'mailto:linternoka@outlook.com'

[menu]
  [[menu.main]]
    identifier = 'home'
    name = '首页'
    url = '/'
    weight = 5

  [[menu.main]]
    identifier = 'archive'
    name = '归档'
    url = '/archives/'
    weight = 10

  [[menu.main]]
    identifier = 'essay'
    name = '杂谈'
    url = '/categories/%E6%9D%82%E8%B0%88/'
    weight = 20

  [[menu.main]]
    identifier = 'moegirl'
    name = '萌百'
    url = '/categories/%E8%90%8C%E7%99%BE/'
    weight = 30

  [[menu.main]]
    identifier = 'scp'
    name = 'SCP'
    url = '/categories/scp/'
    weight = 40

  [[menu.main]]
    identifier = 'works'
    name = '推荐'
    url = '/works/'
    weight = 50

  [[menu.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 70
